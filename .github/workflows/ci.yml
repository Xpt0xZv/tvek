name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

# Default to zero permissions; each job requests only what it strictly needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clippy
        run: rustup component add clippy

      - name: Run Clippy (deny all warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: "1.79.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
        shell: bash

      - name: Run unit and integration tests
        run: cargo test --locked --all-targets

      - name: Build release binary and run CLI smoke test
        if: matrix.toolchain == 'stable'
        shell: bash
        run: |
          cargo build --locked --release
          ./target/release/tvek --version
          printf '{"b":1,"a":[true,null,"ok"]}' | ./target/release/tvek --sort-keys --check - && exit 1 || true
          printf '{\n  "a": [\n    true,\n    null,\n    "ok"\n  ],\n  "b": 1\n}\n' | ./target/release/tvek --sort-keys --check -

  supply-chain-audit:
    name: Supply-Chain & Manifest Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify zero external crate dependencies
        run: |
          if [ -f build.rs ]; then
            echo "::error::build.rs is not permitted!"
            exit 1
          fi
          TREE_LINES=$(cargo tree --locked --target all --edges normal,build,dev --prefix none | sort -u | wc -l)
          if [ "$TREE_LINES" -ne 1 ]; then
            echo "::error::tvek must maintain zero external crate dependencies! Found:"
            cargo tree --locked --target all --edges normal,build,dev
            exit 1
          fi
          echo "Verified zero third-party crates in dependency tree across all targets."

      - name: Verify Cargo.toml and pyproject.toml version parity
        run: |
          CARGO_VER=$(grep -E '^version = "' Cargo.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')
          PY_VER=$(grep -E '^version = "' pyproject.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ -z "$CARGO_VER" ] || [ "$CARGO_VER" != "$PY_VER" ]; then
            echo "::error::Version mismatch: Cargo.toml ($CARGO_VER) != pyproject.toml ($PY_VER)"
            exit 1
          fi
          echo "Verified version parity: $CARGO_VER"

      - name: Verify crates.io package dry-run
        run: cargo publish --locked --dry-run

  python-wheel-smoke:
    name: Maturin Wheel Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Python wheel via Maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --locked

      - name: Install wheel in isolated venv and smoke-test CLI
        run: |
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install --no-index --find-links=dist tvek
          .venv-smoke/bin/tvek --version
          printf '{"valid":true}\n' | .venv-smoke/bin/tvek --lint -
