name: Bug Report
description: Report a bug in tvek's JSON linter, formatter, CLI, or LSP server
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with `tvek`!
        > **Security Note:** If you are reporting a security vulnerability, please do **not** open a public issue. Use [GitHub Private Vulnerability Reporting](https://github.com/Xpt0xZv/tvek/security/advisories/new) instead.

  - type: textarea
    id: summary
    attributes:
      label: Description
      description: A clear and concise description of what happened vs. what you expected.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproduction
      description: Provide the CLI command, flags, and minimal JSON snippet to reproduce the issue.
      placeholder: |
        tvek --check input.json
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tvek Version
      description: Output of `tvek --version`
      placeholder: "tvek 0.1.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating System & Architecture
      description: e.g., Ubuntu 24.04 x86_64, macOS 15 arm64, Windows 11 x64
    validations:
      required: true
