[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tvek"
version = "0.1.2"
description = "Zero-dependency, ultra-fast RFC 8259 JSON linter and formatter"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
keywords = ["json", "linter", "formatter", "cli", "rust"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Xpt0xZv/tvek"
Repository = "https://github.com/Xpt0xZv/tvek"
Issues = "https://github.com/Xpt0xZv/tvek/issues"
Changelog = "https://github.com/Xpt0xZv/tvek/releases"

[tool.maturin]
bindings = "bin"
strip = true
locked = true
